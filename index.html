<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rondy.exe — a little pixel world</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--cr:#fff4de;--ch:#d62839;--pk:#ffc2d4;--bl:#a9d6ff;--lv:#cbb8ff;--ye:#ffe58a;--ink:#3a2438;--px:'Press Start 2P','Courier New',monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--lv) radial-gradient(circle,#fff6 2px,#0000 3px) 0 0/22px 22px;font-family:'Nunito','Trebuchet MS',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:default}
#mon{width:min(98vw,calc((100vh - 30px) * 1.45));background:linear-gradient(#fffaf0,#eadcc0);border-radius:26px;padding:3.2% 3.2% 2.4%;box-shadow:0 8px 0 #b7a581,0 14px 0 #0003,inset 0 0 0 3px #fff}
#scr{border:4px solid #8b7c5e;border-radius:14px;overflow:hidden;background:#222;box-shadow:inset 0 0 20px #000}
#stage{position:relative;aspect-ratio:8/5;overflow:hidden;background:#222;image-rendering:pixelated}
#stage:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000000f 2px 3px);box-shadow:inset 0 0 70px #0005}
svg.rm{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.hs{cursor:pointer}.hs:hover{filter:brightness(1.18) drop-shadow(0 0 2px #fff)}
#tb{height:clamp(22px,4.2vw,32px);background:linear-gradient(#ffd3e0,#ff9db9);border-top:3px solid #fff;display:flex;align-items:center;gap:6px;padding:0 6px;font-family:var(--px);font-size:clamp(6px,1.1vw,9px);color:var(--ink)}
#tb button{font:inherit;padding:3px 6px;background:var(--cr);border:2px outset #fff;cursor:pointer;color:var(--ink)}#tb span{margin-left:auto;background:#fff9;border:2px inset #fff;padding:3px 6px}
#toast{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);max-width:88%;background:var(--cr);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ch);padding:7px 11px;font-size:clamp(11px,1.9vw,15px);font-weight:800;z-index:25;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#fade{position:absolute;inset:0;background:var(--pk);z-index:40;opacity:0;pointer-events:none;transition:opacity .35s steps(5)}#fade.on{opacity:1}
.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94%,640px);max-height:96%;display:flex;flex-direction:column;background:var(--cr);border:3px solid var(--ink);box-shadow:5px 5px 0 #0006;z-index:20;font-size:clamp(11px,1.9vw,15px)}
.win .t{background:linear-gradient(90deg,var(--ch),#ff7a95);color:#fff;font-family:var(--px);font-size:clamp(6px,1.2vw,9px);padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.win .t button{font:inherit;background:var(--cr);color:var(--ink);border:2px outset #fff;cursor:pointer;padding:2px 6px}
.win .b{padding:10px;overflow:auto}
button.pb{font-family:var(--px);font-size:clamp(7px,1.3vw,10px);background:var(--ch);color:#fff;border:3px outset #ff8fa3;padding:8px 10px;cursor:pointer;margin:3px}button.pb:active{border-style:inset}button.bl{background:var(--bl);color:var(--ink);border-color:#e6f3ff}
input,select,textarea,[contenteditable]{font:inherit;border:2px inset #d9cdb0;background:#fff;padding:5px 7px;color:var(--ink);max-width:100%}
.ln{display:flex;gap:6px;align-items:center;padding:4px 6px;border-bottom:1px dashed #d9b8c4}.ln:nth-child(odd){background:#fff8}.ln.on{background:var(--pk)}.ln b{flex:1}
.lib{background:#2b2150;color:#cfe9ff;font-family:'VT323',monospace;font-size:clamp(14px,2.4vw,20px);padding:8px;border:3px inset #8d7fd0}
.eq{display:flex;gap:2px;align-items:flex-end;height:28px}.eq i{width:6px;background:linear-gradient(var(--ch),var(--ye));animation:eq .6s steps(5) infinite alternate}@keyframes eq{from{height:4px}to{height:28px}}
.ov{position:absolute;inset:0;background:#2b2150e8;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;gap:8px;z-index:5}
canvas.gc{width:100%;display:block;image-rendering:pixelated;background:#000;touch-action:none}
.poem{background:#fffdf4;border:6px double var(--ch);padding:10px;text-align:center;line-height:1.55;position:relative}.poem h3{font-family:var(--px);font-size:clamp(8px,1.6vw,12px);color:var(--ch);line-height:1.6}.poem p{margin:.7em 0;font-style:italic}
.sp{position:fixed;pointer-events:none;z-index:99;font-size:12px;animation:spk .7s forwards}@keyframes spk{to{transform:translateY(14px) scale(.2);opacity:0}}
.cf{position:fixed;top:-12px;width:8px;height:8px;z-index:60;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.cl{animation:cl 22s linear infinite}@keyframes cl{from{transform:translateX(-40px)}to{transform:translateX(90px)}}
.bd{animation:cl 9s linear infinite}.bob{animation:bob 1s steps(2) infinite}@keyframes bob{50%{transform:translateY(-2px)}}
.tw{animation:tw 1.4s steps(2) infinite}@keyframes tw{50%{opacity:.2}}.glow{animation:gw 1.2s steps(3) infinite}@keyframes gw{50%{opacity:.4}}
.pop{animation:pop .5s steps(5)}@keyframes pop{from{transform:scale(.4)}}
.bo{animation:bo 4.2s steps(1) infinite}@keyframes bo{0%,93%{opacity:1}94%,97%{opacity:0}98%,100%{opacity:1}}.bb{opacity:0;animation:bb 4.2s steps(1) infinite}@keyframes bb{0%,93%{opacity:0}94%,97%{opacity:1}98%,100%{opacity:0}}
.pg{position:relative;padding:36px 40px 24px;border:5px solid var(--a);outline:2px dashed var(--a);outline-offset:-12px;color:#3a2438;text-align:center;box-shadow:4px 4px 0 #0004;margin:4px 2px}.pg h3{font-family:var(--px);font-size:clamp(9px,1.7vw,13px);color:var(--a);line-height:1.7;margin:.4em 0 .8em}.pt{font-family:var(--px);font-size:clamp(5px,.9vw,7px);color:#8a7a66;letter-spacing:1px}.pb2 p{margin:.9em 0;line-height:1.7;font-style:italic;font-weight:600}.pf{font-family:'VT323',monospace;font-size:1.3em;color:var(--a);margin-top:10px}.st{position:absolute}.tp{position:absolute;top:-9px;width:42px;height:13px;background:#ffe58acc;transform:rotate(-3deg)}.tp+.tp{transform:rotate(3deg)}
.ph{color:#8a7a66}
</style></head><body>
<div id="mon"><div id="scr"><div id="stage"><div id="toast"></div><div id="fade"></div></div><div id="tb"><button onclick="go('main')">🏠 Room</button><button onclick="inv()">🎒 Items <b id="ic">0</b></button><span id="clk"></span></div></div></div>

— Pierre de Ronsard
(Gather, gather your youth.)

**Dear Rondy,**

May twenty-two be kind to you.

May the days ahead bring you little wonders, unexpected happiness, and moments so lovely you'll wish to keep them forever.

May you never run out of reasons to laugh, places to discover, or dreams worth chasing. And when life feels uncertain, may you always find your way towards something beautiful.

Some people come and go like passing seasons. I'm glad our paths crossed, and I hope this one brings you nothing but good things.

**Happy birthday, Twin.**
May this year be a lovely chapter in the story of you.

— Fay`;

const PAL={r:'#d62839',p:'#ffb3c6',y:'#ffe27a',o:'#f08a24',b:'#2a1a2a',w:'#fff6e5',c:'#b9a8d8',f:'#f28c3a',s:'#8fb4d9',e:'#1d1d2b',n:'#26305c',k:'#7a4b2d',d:'#5e3820',h:'#1a110e',g:'#2b2f55',l:'#d8ecff',m:'#3b1e12',u:'#a9d6ff',q:FAY.q,z:FAY.z,S:FAY.S,K:'#15101c',H:'#3d2d5c',M:'#8a2b5c',C:'#0e0a14',P:'#ff7fb0',V:'#1c1230',T:'#6a3fa0',B:'#0e0a14',W:'#fff6e5',a:'#9b6a3c',j:'#c98f55',t:'#fff1d6',i:'#8c1c2c',G:'#3ddc84',L:'#cbb8ff'};

const spr=(rows,x,y,s=1,pal=PAL)=>{let o='';rows.forEach((r,j)=>{let i=0;while(i<r.length){const ch=r[i];if(ch=='.'){i++;continue}let k=i;while(r[k]==ch)k++;o+=`<rect x="${x+i*s}" y="${y+j*s}" width="${(k-i)*s}" height="${s}" fill="${pal[ch]}"/>`;i=k}});return o};
const P=(rows,x,y,s=1,d=R(0,4))=>{const e=rows===FA?'K':'d',bl=rows.map(r=>r.replace(/e/g,e));return `<g class="bo" style="animation-delay:-${d}s">${spr(rows,x,y,s)}</g><g class="bb" style="animation-delay:-${d}s">${spr(bl,x,y,s)}</g>`};
const cs=(c,rows,x,y,s=1)=>rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!='.'){c.fillStyle=PAL[ch];c.fillRect(x+i*s,y+j*s,s,s)}}));

/* windows */
function win(t,b,cl){closeWin();const d=document.createElement('div');d.className='win';d.id='w';d.innerHTML=`<div class="t"><span>${t}</span><button onclick="closeWin()">✕</button></div><div class="b" style="position:relative">${b}</div>`;st.appendChild(d)}

addEventListener('pointermove',e=>{if(Math.random()<.5)return;const s=document.createElement('span');s.className='sp';s.textContent=['✦','♥','✧'][Math.random()*3|0];s.style.cssText=`left:${e.clientX+4}px;top:${e.clientY+4}px;color:${['#d62839','#ff8fb0','#8fb4ff','#e6c200'][Math.random()*4|0]}`;document.body.appendChild(s);setTimeout(()=>s.remove(),700)});

/* ---- POEMS ---- */
const PO=[['The Lamp in the Hallway',[['Some people are a lamp left on in the hall —','not the blaze of noon, nothing announced,','only the quiet amber that says','someone was thinking of you before you came in from the dark.'],['Ordinary evenings change their grammar near you:','the kettle becomes a small ceremony,','a bad day turns into a story we tell badly','together, until the telling makes it light.'],['I have no name for what it is to be expected','by a kind of light that asks for nothing,','only that the door stay unlatched,','and the hallway, whenever I pass, not entirely dark.']]],
['Cartography of Small Wonders',[['You carry the old habit of looking twice —','at the moth on the window, a stranger’s accent,','the way a rumour of rain comes up the street','before the first drop has made up its mind.'],['Most of us stop drawing the map somewhere in our twenties,','say that’s the world, and fold it small.','You keep the margins open. You write in pencil,','as if the coastline might yet be revised.'],['What generosity, to stay unfinished,','to hand a question across the table like a lit match','and trust the one who takes it','to let it warm the room, not burn it.'],['May the unmapped parts of every year','find you a little ahead of schedule,','delighted to be wrong','about how far the water goes.']]],
['What Remains',[['It is never the large days that stay.','Not the announcements, nor the milestones framed,','but a joke that arrived at the wrong hour and was right,','an extra minute at the end of a long evening.'],['Memory keeps odd evidence:','the exact pitch of a laugh, a half-finished sentence,','the way you said take your time','as though time were something you could lend.'],['I used to think significance needed weight.','Now I think it needs only tenderness, repeated —','a small thing handled carefully, again,','until it wears a shape in the hand, like a river stone.'],['So I keep these, unglamorous and exact,','the way one keeps a good pebble in a pocket:','not for its worth, but for knowing','it will be there, smooth, whenever I reach.']]],
['A Warmer Kind of Weather',[['There are people who change the climate of a room','without raising their voice, or raising anything,','who enter, and the afternoon forgets it was grey,','and the corners soften as though told a secret.'],['Your kindness is not the loud kind.','It does not post itself. It simply happens:','a coat held out, a pause where an unkind word','might have stood and was, politely, excused.'],['I have watched how people lean toward you','the way plants turn to a window —','no plan, no speech, only the plain physics','of being made a little warmer.'],['If the years are weather, let this one be mild:','long light, a little rain for the garden,','and always, somewhere in the forecast,','the fact of you, steady as a kettle on the stove.']]]];

let lit=22;const out=i=>{const g=$('#c'+i);if(!g||g.dataset.o)return;g.dataset.o=1;g.querySelectorAll('rect:last-child').forEach(r=>r.setAttribute('fill','#999'));g.querySelectorAll('rect:last-child').forEach(r=>r.classList.remove('glow'));snd(250+i*8,.05,'sine');if(--lit==0)party()};
const sweep=()=>{closeWin();for(let i=0;i<22;i++)setTimeout(()=>out(i),i*90)};
async function mic(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});closeWin();AC=AC||new AudioContext();const an=AC.createAnalyser();AC.createMediaStreamSource(s).connect(an);const b=new Uint8Array(an.fftSize);say('Listening… take a deep breath and blow!',5000);const iv=setInterval(()=>{if(lit<=0||cur!='bday'){clearInterval(iv);s.getTracks().forEach(t=>t.stop());return}an.getByteTimeDomainData(b);let q=0;b.forEach(v=>q+=(v-128)**2);if(Math.sqrt(q/b.length)>14)[...Array(22).keys()].filter(i=>!$('#c'+i).dataset.o).slice(0,3).forEach(out)},120)}catch(e){say('No microphone? No problem — use the button.');}}
function party(){burst(160);const cv=document.createElement('canvas');cv.width=640;cv.height=400;cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:18;pointer-events:none;image-rendering:pixelated';st.appendChild(cv);const x=cv.getContext('2d');let P=[];const B=(px,py)=>{const col=['#d62839','#ffc2d4','#a9d6ff','#ffe27a','#cbb8ff'][Math.random()*5|0];for(let i=0;i<40;i++){const a=R(0,6.3),v=R(1,5);P.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60,c:col})}};const iv=setInterval(()=>{if(!cv.isConnected)return clearInterval(iv);B(R(80,560),R(40,200))},400);B(320,120);(function L(){if(!cv.isConnected)return;x.clearRect(0,0,640,400);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l--;x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5)});P=P.filter(p=>p.l>0);requestAnimationFrame(L)})();
setTimeout(()=>win('★ HAPPY LEVEL 22, TWIN! ★',`<div style="text-align:center"><p style="font-size:1.2em"><b>Every light is out, and the whole house is listening.</b></p><p>Somewhere a very small cheer just went up in a very large sky. Whatever you wished for — it heard you.</p><button class="pb" onclick="song()">🎵 Play “Happy Birthday”</button> <button class="pb bl" onclick="letter()">✉ Read Fay’s letter</button></div>`),1800)}
function song(){if(S.mute)return say('Sound is off.');const N=[[262,.3],[262,.15],[294,.45],[262,.45],[349,.45],[330,.9],[262,.3],[262,.15],[294,.45],[262,.45],[392,.45],[349,.9],[262,.3],[262,.15],[523,.45],[440,.45],[349,.45],[330,.45],[294,.6],[466,.3],[466,.15],[440,.45],[349,.45],[392,.45],[349,.9]];let t=0;N.forEach(([f,d])=>{setTimeout(()=>snd(f,d*.9,'triangle',.06),t*1000);t+=d})}
function letter(){win('Letter.txt — from Fay',`<div class="poem" style="text-align:left;font-style:normal"><div style="white-space:pre-wrap;line-height:1.7">${LETTER}</div></div><p><b>✏ Your own words, Fay</b> <small>(click to type — saved in this browser)</small></p><div contenteditable="true" id="my" style="min-height:90px;background:#fffdf4" onblur="LS.s('my',this.innerHTML)">${LS.g('my','<span class="ph">[Fay: write your own message and your birthday poem here.]</span>')}</div><p style="text-align:center"><button class="pb" onclick="go('main')">Back to the room</button> <button class="pb bl" onclick="burst(90)">🎉</button></p>`)}

win('welcome.txt',`<div style="text-align:center"><svg viewBox="0 0 26 44" width="64" shape-rendering="crispEdges">${P(RON,1,0,2)}</svg><svg viewBox="0 0 26 44" width="64" shape-rendering="crispEdges">${P(FA,1,0,2)}</svg><p style="font-family:var(--px);font-size:.8em;line-height:1.8;color:var(--ch)">Somewhere between yesterday and tomorrow,<br>there’s a little place waiting for you.</p><p>Hello, Rondy. Fay left this on your computer. It’s a house: click things, walk through doors, win the arcade games and they pay out poems. One door glows differently. It opens last.</p><button class="pb" onclick="closeWin();say('Try clicking everything. Even the quiet things.')">▶ ENTER</button></div>`);
